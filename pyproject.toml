[project]
name = "clipz"
version = "0.1.0"
description = "Find top stream clips from creators you have permission to clip, render them vertical, and publish"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp",
    "requests",
    "flask",
    "imageio-ffmpeg",     # ships a known-good ffmpeg, so nothing else needs installing
    "psycopg[binary]",    # Postgres, for the cloud version
    "vercel",             # Vercel Blob storage, for the cloud version
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
clipz = "clipz.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clipz*"]

[tool.setuptools.package-data]
clipz = ["static/*", "fonts/*"]
