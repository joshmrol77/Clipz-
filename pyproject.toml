[project]
name = "clipz"
version = "0.1.0"
description = "Find top stream clips from creators you have permission to clip, render them vertical, and publish"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp",
    "requests",
    "flask",
    "imageio-ffmpeg==0.5.1",  # ffmpeg 4.2 with text drawing, 73 MB; newer builds are 172 MB (too big for Vercel) or lack text
    "psycopg[binary]",    # Postgres, for the cloud version
    "vercel",             # Vercel Blob storage, for the cloud version
    "curl_cffi>=0.10,<0.18",  # browser-like requests Kick requires; yt-dlp supports up to 0.17
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
clipz = "clipz.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clipz*"]

[tool.setuptools.package-data]
clipz = ["static/*", "fonts/*"]
