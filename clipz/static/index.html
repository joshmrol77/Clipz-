<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipz</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="icon" href="/static/icon-192.png">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clipz">
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --line: #2a2f3a; --text: #e8eaf0; --muted: #98a0b3;
    --accent: #7c5cff; --good: #2fbf71; --bad: #e5484d; --warn: #e2a336;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
           padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0 auto 0 0; font-size: 20px; letter-spacing: .5px; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
  nav button { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0;
               color: var(--muted); padding: 10px 14px; }
  nav button.on { color: var(--text); border-bottom-color: var(--accent); }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel);
           color: var(--text); padding: 8px 14px; border-radius: 8px; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.good { background: var(--good); border-color: var(--good); color: #06240f; font-weight: 600; }
  button.ghost-bad { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  input, select { font: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--line);
                  border-radius: 8px; padding: 8px 10px; min-width: 0; }
  input[type=checkbox] { width: 18px; height: 18px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { margin: 0 0 4px; font-size: 16px; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row > input[type=text], .row > input[type=password] { flex: 1 1 180px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .clip { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
          display: flex; flex-direction: column; }
  .clip video { width: 100%; aspect-ratio: 9/16; background: #000; display: block; }
  .clip .body { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .clip .title { font-weight: 600; overflow-wrap: anywhere; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600;
           border: 1px solid var(--line); color: var(--muted); }
  .badge.rendered { color: var(--warn); border-color: var(--warn); }
  .badge.approved, .badge.published { color: var(--good); border-color: var(--good); }
  .badge.failed, .badge.rejected { color: var(--bad); border-color: var(--bad); }
  .err { color: var(--bad); font-size: 13px; overflow-wrap: anywhere; }
  .list { list-style: none; margin: 12px 0 0; padding: 0; }
  .list li { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .list li > span:first-child { flex: 1 1 160px; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
  label.field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 200px; font-size: 13px; color: var(--muted); }
  label.check { display: flex; gap: 8px; align-items: center; }
  #log { font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); white-space: pre-wrap;
         max-height: 180px; overflow-y: auto; overflow-wrap: anywhere; margin: 8px 0 0; }
  #job { color: var(--warn); font-size: 13px; }
  .filters button.on { border-color: var(--accent); color: var(--text); }
  code { background: var(--bg); padding: 1px 6px; border-radius: 6px; overflow-wrap: anywhere; }
  .hidden { display: none; }
  /* bottom tab bar, like Instagram */
  main { padding-bottom: 90px; }
  nav#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; margin: 0; display: flex; gap: 0;
             background: rgba(15,17,21,.96); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); flex-wrap: nowrap; }
  nav#tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 7px;
                    border: 0; font-size: 11px; color: var(--muted); min-width: 0; }
  nav#tabs button svg { width: 24px; height: 24px; }
  nav#tabs button.on { color: var(--text); border: 0; }
  body.on-feed header { display: none; }
  body.on-feed main { padding: 0; }
  /* the swipe feed */
  #feed { position: fixed; inset: 0 0 calc(57px + env(safe-area-inset-bottom)) 0; overflow-y: scroll; scroll-snap-type: y mandatory;
          background: #000; overscroll-behavior: contain; scrollbar-width: none; }
  #feed::-webkit-scrollbar { display: none; }
  .reel { position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden;
          display: flex; align-items: center; justify-content: center;
          padding: calc(env(safe-area-inset-top) + 56px) 0 240px; }  /* video is centred above a strip kept for the caption and buttons */
  .reel .bg { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(30px) brightness(.45); }
  .reel .stage { position: relative; width: 100%; max-width: 900px; aspect-ratio: 16/9; background: #000; }
  .reel .stage > * { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: contain; }
  .reel .stage img { object-fit: cover; }
  /* vertical clips fill the screen like TikTok/Reels; caption and buttons sit on top */
  .reel.tall { padding: 0; }
  .reel.tall .stage { position: absolute; inset: 0; max-width: none; width: 100%; height: 100%; aspect-ratio: auto; }
  .reel.tall .stage video, .reel.tall .stage img { object-fit: cover; }
  .reel.tall .bg { display: none; }
  .reel.tall::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 45%; pointer-events: none; z-index: 1;
                      background: linear-gradient(transparent, rgba(0,0,0,.65)); }
  .reel.tall .meta, .reel.tall .actions { z-index: 2; }
  .reel.tall .stage > button.sound { bottom: auto; top: calc(env(safe-area-inset-top) + 62px); }
  .reel .stage > button.sound { inset: auto; left: 10px; bottom: 10px; width: auto; height: auto; z-index: 3; border-radius: 99px;
                 background: rgba(0,0,0,.6); color: #fff; border: 0; font-size: 13px; padding: 6px 12px; }
  .reel .meta { position: absolute; left: 14px; right: 74px; bottom: 16px; text-shadow: 0 1px 3px rgba(0,0,0,.9); }
  .reel .who { font-weight: 700; font-size: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .reel .plat { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; color: #fff; }
  .plat.twitch { background: #9146ff; } .plat.kick { background: #53fc18; color: #000 !important; } .plat.youtube { background: #ff0033; }
  .reel .title { margin-top: 4px; font-size: 15px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  .reel .sub { margin-top: 4px; font-size: 13px; color: #d6d9e2; }
  .reel .actions { position: absolute; right: 6px; bottom: 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .reel .act { display: flex; flex-direction: column; align-items: center; gap: 1px; background: none; border: 0; padding: 2px 4px;
               color: #fff; font-size: 11px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,.8); text-decoration: none; }
  .reel .act span.ic { width: 34px; height: 34px; display: grid; place-items: center; background: none; }
  .reel .act span.ic svg { width: 28px; height: 28px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.7)); }
  .reel .act:active span.ic { transform: scale(.88); }
  .reel .act.done span.ic { color: var(--good); }
  .reel .act span.ic.hot { color: #fff; }
  .reel .trend { color: #ffb36b; font-weight: 700; }
  .reel .viral { font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 4px; color: #1a0d00;
                 background: linear-gradient(90deg, #ffb36b, #ff6b3d); text-shadow: none; }
  .sheet .layouts { flex-wrap: nowrap; }
  .sheet .layout { padding: 8px 4px; text-align: center; }
  .sheet label.field { flex: none; }
  .feedbar { position: fixed; top: 0; left: 0; right: 0; z-index: 25; display: flex; gap: 8px; align-items: center;
             padding: calc(10px + env(safe-area-inset-top)) 12px 18px; background: linear-gradient(rgba(0,0,0,.7), transparent); pointer-events: none; }
  .feedbar > * { pointer-events: auto; }
  .feedbar .pill { border-radius: 99px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.25); color: #fff;
                   padding: 6px 12px; font-size: 13px; max-width: 38vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .feedbar .pill.set { background: var(--accent); border-color: var(--accent); }
  .feedbar .logo { font-weight: 800; color: #fff; margin-right: auto; font-size: 18px; text-shadow: 0 1px 3px #000; }
  @media (max-width: 430px) {   /* four filter buttons need the room: drop the name */
    .feedbar { gap: 6px; padding-left: 10px; padding-right: 10px; justify-content: flex-end; }
    .feedbar .pill { padding: 5px 9px; font-size: 12px; max-width: 26vw; }
    .feedbar .logo { display: none; }
  }
  .reel.empty { flex-direction: column; gap: 14px; padding: 24px; text-align: center; color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 40;
           background: #fff; color: #000; font-weight: 600; padding: 9px 16px; border-radius: 99px; font-size: 14px; max-width: calc(100vw - 32px); }
  .sheet { position: fixed; inset: auto 0 0 0; margin: 0; width: 100%; max-width: 100%; border-radius: 16px 16px 0 0;
           padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
  .sheet[open] { display: flex; }
  .sheet:not([open]), #editor:not([open]) { display: none; }   /* our display:flex must not keep a closed sheet on screen */
  .sheet .x { position: absolute; top: 8px; right: 10px; width: 36px; height: 36px; padding: 0; border-radius: 50%;
              text-align: center; font-size: 16px; line-height: 34px; }
  .sheet button { text-align: left; padding: 13px 14px; font-size: 15px; }
  .sheet h3 { margin: 4px 0 6px; font-size: 15px; }
  .cat-head { margin: 18px 0 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .suggest-wrap { position: relative; flex: 1 1 220px; min-width: 0; display: flex; }
  .suggest-wrap > input { flex: 1; min-width: 0; }
  .suggest { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 5; list-style: none; margin: 0;
             padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
             box-shadow: 0 10px 30px rgba(0, 0, 0, .45); max-height: 340px; overflow-y: auto; }
  .suggest li { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 8px; cursor: pointer; border: 0; }
  .suggest li.on, .suggest li:hover { background: var(--bg); }
  .suggest img { width: 36px; height: 36px; border-radius: 50%; flex: none; background: var(--line); }
  .suggest .who { flex: 1; min-width: 0; }
  .suggest .who div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .live { color: #fff; background: var(--bad); border-radius: 4px; padding: 0 5px; font-size: 11px; font-weight: 700; }
  .clip { cursor: pointer; }
  .clip:hover { border-color: var(--accent); }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 14px;
           padding: 20px; width: min(860px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
  dialog::backdrop { background: rgba(0, 0, 0, .65); }
  .editor { display: flex; gap: 20px; flex-wrap: wrap; }
  .editor video { width: 250px; aspect-ratio: 9/16; background: #000; border-radius: 10px; flex: 0 0 auto; margin: 0 auto; align-self: flex-start; }
  .editor .side { flex: 1 1 300px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .editor .side label.field { flex: none; }
  .layouts { display: flex; gap: 10px; flex-wrap: wrap; }
  .layout { flex: 1 1 110px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px;
            font-size: 12px; color: var(--muted); text-align: center; }
  .layout.on { border-color: var(--accent); color: var(--text); box-shadow: 0 0 0 1px var(--accent); }
  .mini { width: 45px; height: 80px; border-radius: 5px; background: #2b3040; position: relative; overflow: hidden; }
  .mini i { position: absolute; left: 0; right: 0; }
  .mini .clipbox { background: var(--accent); }
  .mini .game { background: var(--good); }
  .mini .txt { background: #fff; height: 4px; left: 8px; right: 8px; border-radius: 2px; }
</style>
</head>
<body>
<header>
  <h1>Clipz</h1>
  <span id="job"></span>
  <button id="run" class="primary">Find new clips</button>
  <button id="post" class="good">Post ready clips</button>
</header>
<main>
  <nav id="tabs"></nav>
  <section id="feed"></section>
  <section id="clips" class="hidden"></section>
  <section id="streamers" class="hidden"></section>
  <section id="accounts" class="hidden"></section>
  <section id="settings" class="hidden"></section>
  <dialog id="editor"></dialog>
  <dialog id="sheet" class="sheet"></dialog>
</main>
<script>
const TABS = { feed: "Feed", clips: "Publishing", streamers: "Following", accounts: "Accounts", settings: "Settings" };
const FILTERS = { rendered: "Saved", queued: "Editing", approved: "Posting", published: "Posted", rejected: "Rejected", failed: "Failed" };
let S = null, tab = (location.hash.slice(1) in TABS) ? location.hash.slice(1) : "feed", filter = "rendered";
let editing = null, pick = null;  // clip id open in the editor, and the choices made there so far
let dirty = false;  // true while the user is typing in a form, so refreshes don't wipe their input

// Build DOM nodes without ever parsing strings as HTML (clip titles come from the internet).
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "on") for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);
    else if (k in el && k !== "list") el[k] = v; else el.setAttribute(k, v);  // "list" is read-only as a property
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
}
const $ = id => document.getElementById(id);

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { "Content-Type": "application/json", "X-Clipz": "1" }, body: JSON.stringify(body || {}) });
  if (r.status === 401) return location.reload();
  const data = await r.json().catch(() => ({}));
  if (!r.ok) alert(data.error || "Something went wrong (" + r.status + ")");
  else if (data.started === false) alert("Clipz is busy with another task - try again when it finishes.");
  dirty = false;
  await refresh();
  return r.ok;
}

async function refresh() {
  const r = await fetch("/api/state");
  if (r.status === 401) return location.reload();
  S = await r.json();
  $("job").textContent = S.job ? S.job + "…" : "";
  $("run").disabled = $("post").disabled = !!S.job;
  renderTabs();
  if (editing) renderEditor();
  const jobEnded = lastJob && !S.job;
  lastJob = S.job;
  if (tab === "feed") {
    if (!feed.loaded) loadFeed(true);
    else if (jobEnded || Date.now() - (feed.toppedUp || 0) > 10000) { feed.toppedUp = Date.now(); topUpFeed(); }
    updateFeedbar();
  }
  else if (tab === "clips") renderClips();
  else if (!dirty) ({ streamers: renderStreamers, accounts: renderAccounts, settings: renderSettings })[tab]();
}

// ---- Feed: swipe through clips like Reels ---------------------------------------------------
let lastJob = "";
const feed = { loaded: false, loading: false, clips: [], total: 0, game: "", creator: "", creatorName: "", views: "", viral: false, active: null, seen: new Set() };
const VIEW_NAMES = { "": "Any views", "0-100": "0–100", "100-1000": "100–1K", "1000-10000": "1K–10K", "10000-100000": "10K–100K", "100000-": "100K+" };
const ago = iso => {
  const h = (Date.now() - new Date(iso).getTime()) / 3.6e6;
  return !isFinite(h) ? "" : h < 1 ? Math.max(1, Math.round(h * 60)) + "m ago" : h < 48 ? Math.round(h) + "h ago" : Math.round(h / 24) + "d ago";
};
const mmss = sec => sec ? `${Math.floor(sec / 60)}:${String(Math.round(sec % 60)).padStart(2, "0")}` : "";
const compact = n => (n || 0) >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : (n || 0) >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K" : String(n || 0);
const ICONS = {
  feed: "M8 5v14l11-7z",
  clips: "M17 3H7a2 2 0 0 0-2 2v16l7-3 7 3V5a2 2 0 0 0-2-2z",
  streamers: "M16 11a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm-8 0a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm0 2c-2.3 0-7 1.2-7 3.5V19h7v-2.5c0-.9.4-2.2 2.2-3.2A12 12 0 0 0 8 13zm8 0c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z",
  accounts: "M10.6 13.4a1 1 0 0 1 0-1.4l3.4-3.4a1 1 0 1 1 1.4 1.4L12 13.4a1 1 0 0 1-1.4 0zM8.5 19.5a4.5 4.5 0 0 1-3.2-7.7l2.8-2.8 1.4 1.4-2.8 2.8a2.5 2.5 0 0 0 3.5 3.5l2.8-2.8 1.4 1.4-2.8 2.8a4.5 4.5 0 0 1-3.1 1.4zm7.4-4.5-1.4-1.4 2.8-2.8a2.5 2.5 0 1 0-3.5-3.5L11 10.1 9.6 8.7l2.8-2.8a4.5 4.5 0 0 1 6.4 6.4z",
  settings: "M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.7h4l.4-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.4zM13 15.5A3.5 3.5 0 1 1 16.5 12 3.5 3.5 0 0 1 13 15.5z",
  save: "M17 3H7a2 2 0 0 0-2 2v16l7-3 7 3V5a2 2 0 0 0-2-2z",
  saved: "M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z",
  less: "M12 4C7 4 2.7 7.1 1 12a11.8 11.8 0 0 0 4.2 5.4L3 19.6 4.4 21 21 4.4 19.6 3l-2.4 2.4A11.2 11.2 0 0 0 12 4zm0 3a5 5 0 0 1 3 1l-1.5 1.5A3 3 0 0 0 9.5 13.5L8 15a5 5 0 0 1 4-8zm10.9 5a11.8 11.8 0 0 1-9.6 7.9l2.2-2.2a5 5 0 0 0 3.2-3.2l2.9-2.9a11.6 11.6 0 0 1 1.3.4z",
  post: "M5 20h14v-2H5zm7-17-6 6 1.4 1.4L11 6.8V16h2V6.8l3.6 3.6L18 9z",
  open: "M14 3v2h3.6l-9.8 9.8 1.4 1.4L19 6.4V10h2V3zm5 16H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2z",
};
const svgNS = "http://www.w3.org/2000/svg";
function icon(name) {
  const svg = document.createElementNS(svgNS, "svg"), path = document.createElementNS(svgNS, "path");
  svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("fill", "currentColor"); path.setAttribute("d", ICONS[name]);
  svg.append(path);
  return svg;
}
function toast(text) {
  const t = h("div", { className: "toast" }, text);
  document.body.append(t);
  setTimeout(() => t.remove(), 2200);
}

let hlsLoading = null;
// The feed plays clips in its own <video> so they start by themselves: phones allow a muted
// video to autoplay, but Twitch's embedded player insists on a tap. YouTube keeps its own player.
// Sound is on unless you've turned it off. Phones only allow sound after a tap, so the first tap
// anywhere in the feed switches it on; after that the shared player keeps playing with sound.
let soundOn = (() => { try { return localStorage.getItem("clipz-sound") !== "0"; } catch { return true; } })();

function streamFor(c) {   // fetched once per clip, ahead of time for the next one
  if (!c._stream) c._stream = fetch(`/api/clips/${encodeURIComponent(c.id)}/stream`).then(r => r.json()).then(d => d.url || "").catch(() => "");
  return c._stream;
}

// ONE video element for the whole feed, moved from clip to clip. iPhones grant permission to play
// (and to play with sound) per element, so a single element tapped once keeps it for every clip -
// no more clips that refuse to start until you tap them.
const player = { v: null, badge: null, hls: null, clip: null };

function sharedVideo() {
  if (player.v) return player.v;
  const v = h("video", { playsInline: true, loop: true, preload: "auto" });
  v.setAttribute("playsinline", ""); v.setAttribute("webkit-playsinline", "");
  const badge = h("button", { className: "sound" });
  const sync = () => { badge.textContent = v.muted ? "🔇 Tap for sound" : "🔊"; badge.classList.toggle("hidden", !v.muted && soundOn); };
  const toggle = e => {
    e.stopPropagation();
    v.muted = !v.muted; soundOn = !v.muted;
    try { localStorage.setItem("clipz-sound", soundOn ? "1" : "0"); } catch {}
    v.play().catch(() => {});
    sync();
  };
  v.addEventListener("volumechange", sync);
  v.addEventListener("click", toggle);
  badge.addEventListener("click", toggle);
  v.addEventListener("loadedmetadata", () => {   // vertical video: this clip goes full screen
    const c = player.clip;
    if (!c) return;
    c._tall = v.videoHeight > v.videoWidth;
    v.closest(".reel")?.classList.toggle("tall", c._tall);
  });
  // First tap anywhere: that's the permission phones need, so turn the sound on.
  const unlock = () => { if (soundOn && v.muted) { v.muted = false; v.play().catch(() => { v.muted = true; }); } };
  document.addEventListener("touchend", unlock, { passive: true });
  document.addEventListener("click", unlock);
  player.v = v; player.badge = badge; player.sync = sync;
  return v;
}

function playNow(v) {
  v.muted = !soundOn;
  const p = v.play();
  if (p) p.catch(() => { v.muted = true; v.play().catch(() => {}); });   // sound not allowed yet: play muted
  setTimeout(player.sync, 300);
}

function videoPlayer(c, src) {
  const v = sharedVideo();
  player.clip = c;
  if (player.hls) { player.hls.destroy(); player.hls = null; }
  v.pause();
  if (src.includes(".m3u8") && !v.canPlayType("application/vnd.apple.mpegurl")) {
    v.removeAttribute("src");
    hlsLoading = hlsLoading || new Promise((ok, fail) => document.head.append(h("script", {
      src: "https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js", onload: ok, onerror: fail })));
    hlsLoading.then(() => {
      if (player.clip !== c) return;
      player.hls = new window.Hls(); player.hls.loadSource(src); player.hls.attachMedia(v); playNow(v);
    }).catch(() => {});
  } else {
    if (v.getAttribute("src") !== src) v.src = src;
  }
  return [v, player.badge];
}

function embedPlayer(c) {
  const url = c.platform === "twitch" ? `${c.preview}&parent=${location.hostname}&autoplay=true&muted=true`
    : c.preview + (c.preview.includes("?") ? "&" : "?") + "autoplay=1&mute=1&playsinline=1&controls=0&loop=1";
  return h("iframe", { src: url, allow: "autoplay; fullscreen; encrypted-media; picture-in-picture", allowFullscreen: true });
}

async function mountPlayer(el) {
  const c = el._clip;
  if (c._tall || /\/shorts\//.test(c.url || "")) el.classList.add("tall");   // known vertical: full screen straight away
  if (c.platform === "youtube" || !c.preview && c.platform !== "twitch") return el._stage.replaceChildren(embedPlayer(c));
  const src = c.platform === "kick" ? c.preview : await streamFor(c);
  if (feed.active !== el) return;                        // swiped away while we were fetching
  el._stage.replaceChildren(...(src ? videoPlayer(c, src) : [embedPlayer(c)]));
  if (src && player.v && !player.hls) playNow(player.v);   // play once it's in place (moving a video pauses it)
}

function updateFeedbar() {
  const bar = $("feedbar");
  if (!bar) return;
  bar.querySelector(".find").textContent = S && S.job ? S.job.split(" ")[0] + "…" : "Find clips";   // "Finding…", "Editing…"

// After each background search, add whatever is new to the end of the feed - no tapping needed.
async function topUpFeed() {
  if (feed.loading) return;
  const q = new URLSearchParams({ game: feed.game, creator: feed.creator, views: feed.views, viral: feed.viral ? 1 : "", offset: 0, limit: 50 });
  const data = await (await fetch("/api/feed?" + q)).json().catch(() => null);
  if (!data) return;
  const fresh = (data.clips || []).filter(c => !feed.clips.some(x => x.id === c.id));
  feed.total = Math.max(data.total || 0, feed.clips.length + fresh.length);
  if (!fresh.length) return;
  const box = $("feed");
  box.querySelector(".reel.empty")?.remove();
  feed.clips.push(...fresh);
  for (const c of fresh) box.append(reel(c));
  toast(`${fresh.length} new clip${fresh.length === 1 ? "" : "s"} added`);
  if (!feed.active) { const first = box.querySelector(".reel:not(.empty)"); if (first) activate(first); }
}

async function loadFeed(reset) {
  if (feed.loading) return;
  feed.loading = true;
  if (reset) { feed.clips = []; feed.active = null; buildFeed(); }
  const q = new URLSearchParams({ game: feed.game, creator: feed.creator, views: feed.views, viral: feed.viral ? 1 : "", offset: feed.clips.length, limit: 10 });
  const data = await (await fetch("/api/feed?" + q)).json().catch(() => ({ clips: [], total: 0 }));
  const fresh = (data.clips || []).filter(c => !feed.clips.some(x => x.id === c.id));
  feed.clips.push(...fresh); feed.total = data.total || 0; feed.loaded = true; feed.loading = false;
  const box = $("feed");
  box.querySelector(".reel.empty")?.remove();
  for (const c of fresh) box.append(reel(c));
  if (!feed.clips.length) box.append(emptyReel());
}

function buildFeed() {

    h("span", { className: "logo" }, "Clipz"),

    h("button", { className: "pill" + (feed.creator ? " set" : ""), on: { click: () => openFilter("creator") } }, (feed.creatorName || "Creator") + " ▾"),
    h("button", { className: "pill" + (feed.views || feed.viral ? " set" : ""), on: { click: () => openFilter("views") } },

function activate(el) {
  if (feed.active === el) return;
  if (feed.active) {  // stop the previous one by putting its picture back
    const prev = feed.active;
    if (player.v && prev._stage.contains(player.v)) player.v.pause();
    prev._stage.replaceChildren(prev._clip.thumbnail ? h("img", { src: prev._clip.thumbnail, alt: "" }) : "");
  }
  feed.active = el;
  const c = el._clip;
  mountPlayer(el);
  const nextEl = el.nextElementSibling;                  // get the next clip's video ready too
  if (nextEl && nextEl._clip && nextEl._clip.platform === "twitch") streamFor(nextEl._clip);
  if (!feed.seen.has(c.id)) { feed.seen.add(c.id); markSeen(c.id); }
  const reels = [...$("feed").querySelectorAll(".reel:not(.empty)")];
  if (reels.indexOf(el) >= reels.length - 3 && feed.clips.length < feed.total) loadFeed(false);
}

let seenQueue = [], seenTimer = null;
function markSeen(id) {
  seenQueue.push(id);
  clearTimeout(seenTimer);
  seenTimer = setTimeout(() => {
    const ids = seenQueue.splice(0);
    fetch("/api/clips/seen", { method: "POST", headers: { "Content-Type": "application/json", "X-Clipz": "1" }, body: JSON.stringify({ ids }) });
  }, 1500);
}

function next(el) {
  const box = $("feed");
  box.scrollTo({ top: el.offsetTop + el.offsetHeight, behavior: "smooth" });
}

function dropReels(match, from) {
  const box = $("feed"), reels = [...box.querySelectorAll(".reel:not(.empty)")];
  const nextEl = reels.slice(reels.indexOf(from) + 1).find(r => !match(r._clip));
  for (const r of reels) if (match(r._clip)) { feed.observer.unobserve(r); if (feed.active === r) feed.active = null; r.remove(); }
  feed.clips = feed.clips.filter(c => !match(c));
  feed.total -= reels.length - box.querySelectorAll(".reel:not(.empty)").length;
  if (nextEl) { box.scrollTo({ top: nextEl.offsetTop }); activate(nextEl); }
  else if (!feed.clips.length) box.append(emptyReel());
}

function trend(c) {
  const hours = Math.max((Date.now() - new Date(c.created_at).getTime()) / 3.6e6, 0.5);
  const perHour = (c.views || 0) / hours;
  if (!isFinite(perHour) || perHour < 500) return null;
  return h("span", { className: "trend" }, `🔥 ${compact(Math.round(perHour))}/hr  `);
}

  });

  if (d.open && !d.querySelector(":scope > .x")) d.prepend(h("button", { className: "x", "aria-label": "Close", on: { click: () => d.close() } }, "✕"));
}).observe($("sheet"), { childList: true, attributes: true, attributeFilter: ["open"] });
$("run").addEventListener("click", () => api("POST", "/api/run"));
$("post").addEventListener("click", () => api("POST", "/api/publish"));
show();
setInterval(refresh, 3000);
</script>
