<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipz</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="icon" href="/static/icon-192.png">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clipz">
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --line: #2a2f3a; --text: #e8eaf0; --muted: #98a0b3;
    --accent: #7c5cff; --good: #2fbf71; --bad: #e5484d; --warn: #e2a336;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
           padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0 auto 0 0; font-size: 20px; letter-spacing: .5px; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
  nav button { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0;
               color: var(--muted); padding: 10px 14px; }
  nav button.on { color: var(--text); border-bottom-color: var(--accent); }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel);
           color: var(--text); padding: 8px 14px; border-radius: 8px; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.good { background: var(--good); border-color: var(--good); color: #06240f; font-weight: 600; }
  button.ghost-bad { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  input, select { font: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--line);
                  border-radius: 8px; padding: 8px 10px; min-width: 0; }
  input[type=checkbox] { width: 18px; height: 18px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { margin: 0 0 4px; font-size: 16px; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row > input[type=text], .row > input[type=password] { flex: 1 1 180px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .clip { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
          display: flex; flex-direction: column; }
  .clip video { width: 100%; aspect-ratio: 9/16; background: #000; display: block; }
  .clip .body { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .clip .title { font-weight: 600; overflow-wrap: anywhere; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600;
           border: 1px solid var(--line); color: var(--muted); }
  .badge.rendered { color: var(--warn); border-color: var(--warn); }
  .badge.approved, .badge.published { color: var(--good); border-color: var(--good); }
  .badge.failed, .badge.rejected { color: var(--bad); border-color: var(--bad); }
  .err { color: var(--bad); font-size: 13px; overflow-wrap: anywhere; }
  .list { list-style: none; margin: 12px 0 0; padding: 0; }
  .list li { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .list li > span:first-child { flex: 1 1 160px; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
  label.field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 200px; font-size: 13px; color: var(--muted); }
  label.check { display: flex; gap: 8px; align-items: center; }
  #log { font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); white-space: pre-wrap;
         max-height: 180px; overflow-y: auto; overflow-wrap: anywhere; margin: 8px 0 0; }
  #job { color: var(--warn); font-size: 13px; }
  .filters button.on { border-color: var(--accent); color: var(--text); }
  code { background: var(--bg); padding: 1px 6px; border-radius: 6px; overflow-wrap: anywhere; }
  .hidden { display: none; }
  .feed { display: flex; flex-direction: column; gap: 16px; max-width: 560px; margin: 0 auto; }
  .find { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .find .player { position: relative; aspect-ratio: 16/9; background: #000; }
  .find .player img, .find .player iframe, .find .player video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
  .find .player video { object-fit: contain; }
  .find .play { position: absolute; inset: 0; display: grid; place-items: center; background: none; border: 0; border-radius: 0; padding: 0; }
  .find .play span { width: 64px; height: 64px; border-radius: 50%; background: rgba(0,0,0,.6); display: grid; place-items: center; font-size: 26px; color: #fff; }
  .find .player .length { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.75); color: #fff; font-size: 12px; padding: 1px 6px; border-radius: 4px; }
  .find .body { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
  .chips button { white-space: nowrap; border-radius: 99px; }
  .chips button.on { border-color: var(--accent); background: var(--accent); color: #fff; }
  .game-art { width: 36px; height: 48px; border-radius: 4px; object-fit: cover; flex: none; background: var(--line); }
  .suggest img.game-art { border-radius: 4px; width: 36px; height: 48px; }
  button.badge { cursor: pointer; padding: 1px 8px; font: inherit; font-size: 12px; font-weight: 600; }
  .cat-head { margin: 18px 0 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .suggest-wrap { position: relative; flex: 1 1 220px; min-width: 0; display: flex; }
  .suggest-wrap > input { flex: 1; min-width: 0; }
  .suggest { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 5; list-style: none; margin: 0;
             padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
             box-shadow: 0 10px 30px rgba(0, 0, 0, .45); max-height: 340px; overflow-y: auto; }
  .suggest li { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 8px; cursor: pointer; border: 0; }
  .suggest li.on, .suggest li:hover { background: var(--bg); }
  .suggest img { width: 36px; height: 36px; border-radius: 50%; flex: none; background: var(--line); }
  .suggest .who { flex: 1; min-width: 0; }
  .suggest .who div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .live { color: #fff; background: var(--bad); border-radius: 4px; padding: 0 5px; font-size: 11px; font-weight: 700; }
  .clip { cursor: pointer; }
  .clip:hover { border-color: var(--accent); }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 14px;
           padding: 20px; width: min(860px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
  dialog::backdrop { background: rgba(0, 0, 0, .65); }
  .editor { display: flex; gap: 20px; flex-wrap: wrap; }
  .editor video { width: 250px; aspect-ratio: 9/16; background: #000; border-radius: 10px; flex: 0 0 auto; margin: 0 auto; align-self: flex-start; }
  .editor .side { flex: 1 1 300px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .editor .side label.field { flex: none; }
  .layouts { display: flex; gap: 10px; flex-wrap: wrap; }
  .layout { flex: 1 1 110px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px;
            font-size: 12px; color: var(--muted); text-align: center; }
  .layout.on { border-color: var(--accent); color: var(--text); box-shadow: 0 0 0 1px var(--accent); }
  .mini { width: 45px; height: 80px; border-radius: 5px; background: #2b3040; position: relative; overflow: hidden; }
  .mini i { position: absolute; left: 0; right: 0; }
  .mini .clipbox { background: var(--accent); }
  .mini .game { background: var(--good); }
  .mini .txt { background: #fff; height: 4px; left: 8px; right: 8px; border-radius: 2px; }
</style>
</head>
<body>
<header>
  <h1>Clipz</h1>
  <span id="job"></span>
  <button id="run" class="primary">Find new clips</button>
  <button id="post" class="good">Post approved clips</button>
</header>
<main>
  <nav id="tabs"></nav>
  <section id="browse"></section>
  <section id="clips" class="hidden"></section>
  <section id="streamers" class="hidden"></section>
  <section id="accounts" class="hidden"></section>
  <section id="settings" class="hidden"></section>
  <dialog id="editor"></dialog>
  <div class="panel">
    <h2>Activity</h2>
    <pre id="log">Nothing yet.</pre>
  </div>
</main>
<script>
const TABS = { browse: "Browse", clips: "Edited", streamers: "Streamers", accounts: "Accounts", settings: "Settings" };
const FILTERS = { queued: "Being edited", rendered: "To review", approved: "Approved", published: "Posted", rejected: "Rejected", failed: "Failed" };
let S = null, tab = (location.hash.slice(1) in TABS) ? location.hash.slice(1) : "browse", filter = "rendered";
let editing = null, pick = null;  // clip id open in the editor, and the choices made there so far
let dirty = false;  // true while the user is typing in a form, so refreshes don't wipe their input

// Build DOM nodes without ever parsing strings as HTML (clip titles come from the internet).
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "on") for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);
    else if (k in el && k !== "list") el[k] = v; else el.setAttribute(k, v);  // "list" is read-only as a property
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
}
const $ = id => document.getElementById(id);

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { "Content-Type": "application/json", "X-Clipz": "1" }, body: JSON.stringify(body || {}) });
  if (r.status === 401) return location.reload();
  const data = await r.json().catch(() => ({}));
  if (!r.ok) alert(data.error || "Something went wrong (" + r.status + ")");
  else if (data.started === false) alert("Clipz is busy with another task - try again when it finishes.");
  dirty = false;
  await refresh();
  return r.ok;
}

async function refresh() {
  const r = await fetch("/api/state");
  if (r.status === 401) return location.reload();
  S = await r.json();
  $("job").textContent = S.job ? S.job + "…" : "";
  $("run").disabled = $("post").disabled = !!S.job;
  const log = $("log"), atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
  log.textContent = S.log.length ? S.log.map(([t, m]) => new Date(t * 1000).toLocaleTimeString() + "  " + m).join("\n") : "Nothing yet.";
  if (atBottom) log.scrollTop = log.scrollHeight;
  renderTabs();
  if (editing) renderEditor();
  const jobEnded = lastJob && !S.job;
  lastJob = S.job;
  if (tab === "browse") { if (!browse.loaded || jobEnded) loadBrowse(true); }
  else if (tab === "clips") renderClips();
  else if (!dirty) ({ streamers: renderStreamers, accounts: renderAccounts, settings: renderSettings })[tab]();
}

// ---- Browse: everything Clipz found, to watch and pick from ----------------------------------
let lastJob = "";
const browse = { loaded: false, category: "", clips: [], total: 0, loading: false, playing: null };
const ago = iso => {
  const h = (Date.now() - new Date(iso).getTime()) / 3.6e6;
  return !isFinite(h) ? "" : h < 1 ? Math.max(1, Math.round(h * 60)) + "m ago" : h < 48 ? Math.round(h) + "h ago" : Math.round(h / 24) + "d ago";
};
const mmss = sec => sec ? `${Math.floor(sec / 60)}:${String(Math.round(sec % 60)).padStart(2, "0")}` : "";

async function loadBrowse(reset) {
  if (browse.loading) return;
  browse.loading = true;
  if (reset) { browse.clips = []; browse.playing = null; }
  const q = new URLSearchParams({ category: browse.category, offset: browse.clips.length, limit: 20 });
  const data = await (await fetch("/api/browse?" + q)).json().catch(() => ({ clips: [], total: 0 }));
  browse.clips.push(...(data.clips || [])); browse.total = data.total || 0; browse.loaded = true; browse.loading = false;
  renderBrowse();
}

function playerFor(c) {
  if (c.platform === "kick" && c.preview)
    return h("video", { src: c.preview, controls: true, autoplay: true, playsInline: true });
  const url = c.platform === "twitch" ? `${c.preview}&parent=${location.hostname}&autoplay=true`
    : c.preview + (c.preview.includes("?") ? "&" : "?") + "autoplay=1";
  return h("iframe", { src: url, allow: "autoplay; fullscreen; encrypted-media", allowFullscreen: true });
}

function findCard(c) {
  const player = h("div", { className: "player" });
  const still = () => player.replaceChildren(
    c.thumbnail ? h("img", { src: c.thumbnail, alt: "", loading: "lazy" }) : null,
    c.preview
      ? h("button", { className: "play", title: "Play", on: { click: () => {
          if (browse.playing && browse.playing !== still) browse.playing();   // stop the other one
          browse.playing = still;
          player.replaceChildren(playerFor(c));
        } } }, h("span", {}, "▶"))
      : h("a", { href: c.url, target: "_blank", rel: "noopener", className: "play", title: "Watch on " + c.platform }, h("span", {}, "↗")),
    c.duration ? h("span", { className: "length" }, mmss(c.duration)) : null);
  still();
  const id = encodeURIComponent(c.id);
  const act = async (action) => {
    if (!(await api("POST", `/api/clips/${id}/${action}`))) return;
    if (action === "skip") { browse.clips = browse.clips.filter(x => x.id !== c.id); browse.total--; }
    else c.status = "queued";
    renderBrowse();
  };
  const state = {
    discovered: [h("button", { className: "primary", on: { click: () => act("edit") } }, "Edit this clip"),
                 h("button", { on: { click: () => act("skip") } }, "Skip")],
    queued: h("span", { className: "badge" }, "Being edited…"),
    failed: [h("span", { className: "badge failed" }, "Failed"), h("button", { on: { click: () => act("edit") } }, "Try again")],
  }[c.status] || h("span", { className: "badge approved" }, "Edited - see the Edited tab");
  return h("div", { className: "find" }, player,
    h("div", { className: "body" },
      h("div", { className: "title" }, c.title || "(untitled)"),
      h("div", { className: "muted" }, [c.streamer, c.platform, `${(c.views || 0).toLocaleString()} views`, ago(c.created_at)].filter(Boolean).join(" · ")),
      c.uploader ? h("div", { className: "muted" }, "Posted by " + c.uploader) : null,
      h("div", { className: "row" }, h("span", { className: "badge" }, c.category), h("span", { style: "flex:1" }), state)));
}

function renderBrowse() {
  const cats = ["", ...(S.categories || [])];
  const chips = h("div", { className: "chips" }, cats.map(cat =>
    h("button", { className: cat === browse.category ? "on" : "", on: { click: () => { browse.category = cat; loadBrowse(true); } } }, cat || "All")));
  const sentinel = h("div", { style: "height:1px" });
  const feed = h("div", { className: "feed" }, browse.clips.map(findCard), sentinel);
  const empty = !S.creators.length ? "Add streamers on the Streamers tab, then press \"Find new clips\"."
    : S.job ? "Looking for clips…" : "Nothing found yet. Press \"Find new clips\" to look.";
  $("browse").replaceChildren(chips,
    h("div", { className: "row muted", style: "margin-bottom:10px" }, `${browse.total} clip${browse.total === 1 ? "" : "s"} found`,
      h("span", { style: "flex:1" }), h("button", { on: { click: () => loadBrowse(true) } }, "Refresh")),
    browse.clips.length ? feed : h("p", { className: "muted" }, empty));
  if (browse.clips.length < browse.total) {
    new IntersectionObserver((entries, obs) => { if (entries[0].isIntersecting) { obs.disconnect(); loadBrowse(false); } })
      .observe(sentinel);
  }
}

function renderTabs() {
  $("tabs").replaceChildren(...Object.entries(TABS).map(([id, name]) =>
    h("button", { className: id === tab ? "on" : "", on: { click: () => { tab = id; location.hash = id; dirty = false; show(); } } }, name)));
}
function show() {
  for (const id of Object.keys(TABS)) $(id).classList.toggle("hidden", id !== tab);
  refresh();
}

function renderClips() {
  const counts = {};
  for (const c of S.clips) counts[c.status] = (counts[c.status] || 0) + 1;
  const bar = h("div", { className: "row filters", style: "margin-bottom:16px" },
    Object.entries(FILTERS).map(([id, name]) =>
      h("button", { className: id === filter ? "on" : "", on: { click: () => { filter = id; renderClips(); } } },
        `${name} (${counts[id] || 0})`)),
    filter === "rendered" && counts.rendered ? h("button", { on: { click: approveAll } }, "Approve all") : null,
    filter === "failed" && counts.failed ? h("button", { on: { click: () => api("POST", "/api/retry") } }, "Retry failed") : null);
  const shown = S.clips.filter(c => c.status === filter);
  const key = filter + "|" + shown.map(c => c.id + c.status + c.version + c.title + JSON.stringify(c.posts)).join(",");
  const root = $("clips");
  if (root.dataset.key === key) { root.firstChild.replaceWith(bar); return; }  // keep videos playing
  root.dataset.key = key;
  const empty = filter === "rendered"
    ? "No edited clips waiting for review. Pick clips to edit on the Browse tab." + (S.waiting ? ` (${S.waiting} found there so far.)` : "")
    : "Nothing here.";
  root.replaceChildren(bar, shown.length ? h("div", { className: "grid" }, shown.map(clipCard)) : h("p", { className: "muted" }, empty));
}

const MINI = {
  framed: () => [h("i", { className: "txt", style: "top:16px" }), h("i", { className: "clipbox", style: "top:27px;height:26px" })],
  full: () => [h("i", { className: "clipbox", style: "top:0;height:80px" })],
  split: () => [h("i", { className: "clipbox", style: "top:0;height:40px" }), h("i", { className: "game", style: "top:40px;height:40px" }), h("i", { className: "txt", style: "top:38px" })],
};
const NAMES = { framed: "Framed", full: "Just the clip", split: "Clip + gameplay" };
const mediaUrl = c => c.media_url + "#t=0.1";

function openEditor(c) {
  editing = c.id;
  pick = { layout: c.layout, background: c.background || "", title: c.title };
  $("editor").dataset.key = "";
  renderEditor();
  $("editor").showModal();
}
function closeEditor() { editing = null; $("editor").close(); }

function renderEditor() {
  const c = S.clips.find(x => x.id === editing);
  if (!c) return closeEditor();
  const key = [c.version, c.status, S.job, S.backgrounds.join("|"), pick.layout, pick.background].join("~");
  const root = $("editor");
  if (root.dataset.key === key) return;  // nothing changed: don't restart the video or lose typing
  root.dataset.key = key;
  const id = encodeURIComponent(c.id), beingEdited = c.status === "queued", editable = !["published", "queued"].includes(c.status);
  const title = h("input", { type: "text", value: pick.title, disabled: !editable, on: { input: e => pick.title = e.target.value } });
  const tiles = Object.keys(S.layouts).map(name =>
    h("button", { className: "layout" + (name === pick.layout ? " on" : ""), title: S.layouts[name], disabled: !editable,
                  on: { click: () => { pick.layout = name; renderEditor(); } } },
      h("div", { className: "mini" }, MINI[name] ? MINI[name]() : []), NAMES[name] || name));
  const upload = h("input", { type: "file", accept: "video/*", className: "hidden", on: { change: e => uploadBackground(e.target.files[0]) } });
  const gameplay = pick.layout !== "split" ? null : h("div", {},
    h("div", { className: "muted" }, "Gameplay video for the bottom half (use footage you recorded or have the rights to)"),
    h("div", { className: "row", style: "margin-top:6px" },
      S.backgrounds.length
        ? h("select", { style: "flex:1", on: { change: e => { pick.background = e.target.value; } } },
            S.backgrounds.map(b => h("option", { value: b, selected: b === pick.background }, b)))
        : h("span", { className: "err", style: "flex:1" }, "None added yet."),
      S.cloud ? null : upload, S.cloud ? null : h("button", { on: { click: () => upload.click() } }, "Upload…"),
      h("button", { on: { click: backgroundFromLink } }, "Add from link…")));
  const changed = pick.layout !== c.layout || pick.title !== c.title || (pick.layout === "split" && (pick.background || S.backgrounds[0] || "") !== (c.background || ""));
  const apply = () => api("POST", `/api/clips/${id}/layout`, { layout: pick.layout, title: pick.title,
    background: pick.layout === "split" ? (pick.background || S.backgrounds[0] || "") : "" });
  root.replaceChildren(h("div", { className: "editor" },
    c.out_path ? h("video", { src: mediaUrl(c), controls: true, preload: "metadata" }) : null,
    h("div", { className: "side" },
      h("div", { className: "row" }, h("h2", { style: "margin:0 auto 0 0" }, "Edit clip"), h("span", { className: "badge " + c.status }, FILTERS[c.status] || c.status)),
      h("div", { className: "muted" }, `${c.credit} · ${c.views.toLocaleString()} views`),
      h("label", { className: "field" }, "Headline (also used as the post title)", title),
      h("div", {}, h("div", { className: "muted", style: "margin-bottom:6px" }, "Layout"), h("div", { className: "layouts" }, tiles)),
      gameplay,
      c.status === "failed" ? h("div", { className: "err" }, c.error) : null,
      editable ? h("button", { className: "primary", on: { click: apply } }, changed ? "Apply and re-edit" : "Re-edit clip")
        : h("div", { className: "muted" }, beingEdited ? "Being edited - the new version appears here when it's ready." : "Already posted - can't be changed."),
      h("div", { className: "row" },
        ["rendered", "rejected"].includes(c.status) ? h("button", { className: "good", on: { click: async () => { await api("POST", `/api/clips/${id}/approve`); closeEditor(); } } }, "Approve") : null,
        ["rendered", "approved"].includes(c.status) ? h("button", { className: "ghost-bad", on: { click: async () => { await api("POST", `/api/clips/${id}/reject`); closeEditor(); } } }, "Reject") : null,
        h("button", { style: "margin-left:auto", on: { click: closeEditor } }, "Close")))));

async function backgroundFromLink() {
  const url = prompt("Paste a link to a gameplay video (YouTube, Streamable, a direct .mp4 link…). The first 3 minutes are used.");
  if (!url) return;
  $("job").textContent = "Downloading gameplay video…";
  const r = await fetch("/api/backgrounds/link", { method: "POST", headers: { "Content-Type": "application/json", "X-Clipz": "1" }, body: JSON.stringify({ url }) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) return alert(data.error || "Couldn't add that video (" + r.status + ")");
  pick.background = data.name;
  $("editor").dataset.key = "";
  await refresh();
}

async function uploadBackground(file) {
  if (!file) return;
  const form = new FormData();
  form.append("file", file);
  const r = await fetch("/api/backgrounds", { method: "POST", headers: { "X-Clipz": "1" }, body: form });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) return alert(data.error || "Upload failed (" + r.status + ")");
  pick.background = data.name;
  await refresh();
}

function clipCard(c) {

    p.ref ? h("div", { className: "muted" }, `Posted to ${name}: `, /^https?:/.test(p.ref) ? h("a", { href: p.ref, target: "_blank", rel: "noopener", style: "color:inherit" }, "open") : p.ref)
          : h("div", { className: "err" }, `${name}: ${p.error}`));
  return h("div", { className: "clip", title: "Click to change the layout", on: { click: () => openEditor(c) } },

    h("div", { className: "body" },

}
async function approveAll() {
  for (const c of S.clips.filter(c => c.status === "rendered")) await api("POST", `/api/clips/${encodeURIComponent(c.id)}/approve`);
}

function renderStreamers() {
  const platform = h("select", {}, [["twitch", "Twitch"], ["kick", "Kick"], ["youtube", "YouTube"]].map(([v, n]) => h("option", { value: v }, n)));
  const channel = h("input", { type: "text", autocomplete: "off", autocapitalize: "off", spellcheck: false,
    placeholder: "Start typing a streamer's name…" });
  platform.addEventListener("change", () => { channel.value = ""; pickedName = ""; });
  const menu = h("ul", { className: "suggest hidden", role: "listbox" });
  let results = [], active = -1, timer = null, asked = "";
  const hint = h("div", { className: "muted", style: "margin-top:6px;font-size:13px" });
  const minChars = () => platform.value === "youtube" ? 3 : 2;
  const setHint = (msg) => {
    hint.textContent = msg ?? (platform.value === "twitch" && !S.accounts.twitch ? "Connect Twitch in Settings to get suggestions as you type."
      : platform.value === "youtube" ? "Type a channel name - suggestions take a second on YouTube." : "");
  };
  const close = () => { menu.classList.add("hidden"); active = -1; };
  const choose = r => { channel.value = r.login; pickedName = r.name; close(); };
  const paint = () => {
    menu.replaceChildren(...results.map((r, i) => h("li", { className: i === active ? "on" : "", role: "option",
        on: { mousedown: e => { e.preventDefault(); choose(r); } } },
      r.image ? h("img", { src: r.image, alt: "", loading: "lazy" }) : h("img", { alt: "" }),
      h("div", { className: "who" }, h("div", {}, r.name, " ", r.live ? h("span", { className: "live" }, "LIVE") : null),
        h("div", { className: "muted", style: "font-size:13px" }, r.game || r.login)))));
    menu.classList.toggle("hidden", !results.length);
  };
  const lookup = async () => {
    const q = channel.value.trim();
    pickedName = "";
    if (q.length < minChars() || (platform.value === "twitch" && !S.accounts.twitch)) { results = []; return close(); }
    asked = q;
    const r = await fetch(`/api/search/streamers?platform=${platform.value}&q=${encodeURIComponent(q)}`);
    const data = await r.json().catch(() => ({ results: [] }));
    if (asked !== q || channel.value.trim() !== q) return;  // a newer search is on its way
    results = data.results || []; active = -1; paint();
    setHint(data.error || (results.length ? "" : undefined));
  };
  channel.addEventListener("input", () => { dirty = true; clearTimeout(timer); timer = setTimeout(lookup, platform.value === "youtube" ? 450 : 250); });
  channel.addEventListener("keydown", e => {
    if (menu.classList.contains("hidden")) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      active = (active + (e.key === "ArrowDown" ? 1 : -1) + results.length) % results.length; paint();
    } else if (e.key === "Enter" && active >= 0) { e.preventDefault(); choose(results[active]); }
    else if (e.key === "Escape") close();
  });
  channel.addEventListener("blur", () => setTimeout(close, 150));
  platform.addEventListener("change", () => { results = []; close(); setHint(); });
  setHint();
  const game = S.settings.game;
  const what = h("select", {}, h("option", { value: "all" }, "All their clips"), game ? h("option", { value: "" }, `Only their ${game} clips`) : null);
  const cats = S.categories || [];
  const catList = h("datalist", { id: "cat-list" }, cats.map(cat => h("option", { value: cat })));
  const category = h("input", { type: "text", value: (() => { try { return localStorage.getItem("clipz-cat"); } catch { return ""; } })() || cats[0] || "", list: "cat-list",
    placeholder: "Category, e.g. GTA 6 or IRL", on: { input: () => dirty = true } });
  let pickedName = "";
  const tags = h("input", { type: "text", placeholder: "Hashtags for this streamer (optional), e.g. togi, irl", on: { input: () => dirty = true } });
  const add = () => { try { localStorage.setItem("clipz-cat", category.value.trim()); } catch {}
    return api("POST", "/api/creators", { platform: platform.value, channel: channel.value, category: category.value, name: pickedName,
    all_content: what.value === "all", hashtags: tags.value.split(",").map(s => s.trim()).filter(Boolean) }); };
  $("streamers").replaceChildren(gamesPanel(), h("div", { className: "panel" },
    h("h2", {}, "Streamers to clip"),
    h("p", { className: "muted" }, "Clipz only looks at channels on this list. Stick to creators who run a clipping program or have said it's OK - posting footage without permission gets channels struck."),
    h("div", { className: "row" }, platform, h("div", { className: "suggest-wrap" }, channel, menu)),
    hint,
    h("div", { className: "row", style: "margin-top:10px" }, category, catList, what),
    h("div", { className: "row", style: "margin-top:10px" }, tags, h("button", { className: "primary", on: { click: add } }, "Add")),
    S.creators.length ? cats.flatMap(cat => [
      h("h3", { className: "cat-head" }, cat),
      h("ul", { className: "list" }, S.creators.filter(c => c.category === cat).map(c =>
        h("li", {}, h("span", {}, c.name || c.channel, c.hashtags.length ? h("span", { className: "muted" }, "  #" + c.hashtags.join(" #")) : null),
          game ? h("button", { className: "badge", title: "Tap to switch", on: { click: () => api("POST", "/api/creators/toggle", c) } },
            c.all_content ? "All clips" : game + " only") : h("span", { className: "badge" }, "All clips"),
          h("span", { className: "badge" }, c.platform),
          h("button", { className: "ghost-bad", on: { click: () => api("DELETE", "/api/creators", c) } }, "Remove"))))])
      : h("p", { className: "muted", style: "margin-top:14px" }, "No streamers yet.")));
}

// ---- Games & categories: follow a game, get the most-viewed clips from everyone playing it ----
function gamesPanel() {
  const input = h("input", { type: "text", autocomplete: "off", spellcheck: false, placeholder: "Search a game or category, e.g. Grand Theft Auto VI" });
  const label = h("input", { type: "text", placeholder: "Call it (optional), e.g. GTA 6", on: { input: () => dirty = true } });
  const menu = h("ul", { className: "suggest hidden", role: "listbox" });
  const note = h("div", { className: "muted", style: "margin-top:6px;font-size:13px" },
    S.accounts.twitch ? "" : "Connect Twitch in Settings to search games.");
  let picked = null, timer = null, asked = "";
  const close = () => menu.classList.add("hidden");
  const lookup = async () => {
    const q = input.value.trim();
    picked = null;
    if (q.length < 2 || !S.accounts.twitch) return close();
    asked = q;
    const data = await (await fetch("/api/search/games?q=" + encodeURIComponent(q))).json().catch(() => ({ results: [] }));
    if (asked !== q || input.value.trim() !== q) return;
    note.textContent = data.error || "";
    menu.replaceChildren(...(data.results || []).map(g => h("li", { role: "option", on: { mousedown: e => {
      e.preventDefault(); picked = g; input.value = g.name; close();
    } } }, h("img", { className: "game-art", src: g.image, alt: "" }), h("div", { className: "who" }, h("div", {}, g.name)))));
    menu.classList.toggle("hidden", !(data.results || []).length);
  };
  input.addEventListener("input", () => { dirty = true; clearTimeout(timer); timer = setTimeout(lookup, 250); });
  input.addEventListener("blur", () => setTimeout(close, 150));
  const add = () => {
    if (!picked) return alert("Pick the game from the list that appears as you type.");
    api("POST", "/api/games", { ...picked, label: label.value });
  };
  const games = S.games || [];
  return h("div", { className: "panel" },
    h("h2", {}, "Games & categories"),
    h("p", { className: "muted" }, "Follow a game to get its most-viewed clips from everyone streaming it on Twitch, plus the most-viewed short YouTube videos about it."),
    h("div", { className: "row" }, h("div", { className: "suggest-wrap" }, input, menu)),
    note,
    h("div", { className: "row", style: "margin-top:10px" }, label, h("button", { className: "primary", on: { click: add } }, "Follow")),
    games.length ? h("ul", { className: "list" }, games.map(g => h("li", {},
      g.image ? h("img", { className: "game-art", src: g.image.replace("{width}", "72").replace("{height}", "96"), alt: "" }) : null,
      h("span", {}, g.label, g.label !== g.name ? h("span", { className: "muted" }, "  " + g.name) : null),
      h("button", { className: "ghost-bad", on: { click: () => api("DELETE", "/api/games", g) } }, "Unfollow"))))
    : null);
}

    panel("instagram", "Instagram Reels",
